name: ci

# agent-bus has no test suite yet. This gate proves the pinned dependencies install on Python 3.12
# and the daemon compiles. Add real tests here when they exist.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: nooma-build
    container:
      image: nooma/ci-python:3.12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Compile
        run: python -m py_compile daemon.py
